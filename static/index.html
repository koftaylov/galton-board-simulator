<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard Distribution Visualization</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">


    <section class="controls">
      <label>
        Balls:
        <input id="balls" type="number" min="1" max="1000000" value="200" />
      </label>
      <label>
        Levels:
        <input id="levels" type="number" min="1" max="20" value="12" />
      </label>
      <label>
        Speed:
        <select id="speed">
          <option value="slow">Slow</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>
      </label>
      <label class="bias-control">
        Right bias:
        <div class="bias-inputs">
          <input id="bias" type="range" min="0" max="100" value="50" />
          <input id="biasValue" type="number" min="0" max="100" value="50" aria-label="Right bias percentage" />
        </div>
      </label>
      <fieldset class="wildcard-selector" aria-label="Wildcard obstacles">
        <legend>Wildcards:</legend>
        <label class="wildcard-mirror">
          <input type="checkbox" name="wildcardType" value="mirror" />
          <span>Mirror</span>
        </label>
        <label class="wildcard-magnet">
          <input type="checkbox" name="wildcardType" value="magnet" />
          <span>Magnet</span>
        </label>
        <label class="wildcard-repeller">
          <input type="checkbox" name="wildcardType" value="repeller" />
          <span>Repeller</span>
        </label>
        <label class="wildcard-teleporter">
          <input type="checkbox" name="wildcardType" value="teleporter" />
          <span>Teleporter</span>
        </label>
        <label class="wildcard-splitter">
          <input type="checkbox" name="wildcardType" value="splitter" />
          <span>Splitter</span>
        </label>
        <label class="wildcard-sticky">
          <input type="checkbox" name="wildcardType" value="sticky" />
          <span>Sticky</span>
        </label>
        <label class="wildcard-chaos">
          <input type="checkbox" name="wildcardType" value="chaos" />
          <span>Chaos</span>
        </label>
        <label class="wildcard-wildcard">
          <input type="checkbox" name="wildcardType" value="wildcard" />
          <span>Wildcard</span>
        </label>
      </fieldset>
      <fieldset class="mode-selector" aria-label="Launch mode">
        <legend>Mode:</legend>
        <label>
          <input type="radio" name="launchMode" value="finish" checked />
          <span>Finish</span>
        </label>
        <label>
          <input type="radio" name="launchMode" value="level5" />
          <span>Level 5</span>
        </label>
        <label>
          <input type="radio" name="launchMode" value="level2" />
          <span>Level 2</span>
        </label>
        <label>
          <input type="radio" name="launchMode" value="all" />
          <span>All</span>
        </label>
        <label>
          <input type="radio" name="launchMode" value="avalanche" />
          <span>Avalanche</span>
        </label>
      </fieldset>
      <div class="button-group">
        <button id="generate">Simulate</button>
        <button id="pause" class="pause">Pause</button>
        <button id="stop" class="stop">Stop</button>
      </div>
      <div id="launchCounter" class="launch-counter" aria-live="polite">Launched 0 / 0</div>
      <fieldset class="sound-selector" aria-label="Sound mode">
        <legend>Sound:</legend>
        <label>
          <input type="radio" name="soundMode" value="off" checked />
          <span>Off</span>
        </label>
        <label>
          <input type="radio" name="soundMode" value="bounce" />
          <span>Bounce</span>
        </label>
        <label>
          <input type="radio" name="soundMode" value="sonification" />
          <span>Sonification</span>
        </label>
        <label>
          <input type="radio" name="soundMode" value="levels" />
          <span>Levels</span>
        </label>
      </fieldset>
      <div class="toggle-group">
        <label class="toggle-control path-control">
          <input id="pathToggle" type="checkbox" />
          <span>Show paths</span>
        </label>
        <label class="toggle-control turn-color-control">
          <input id="turnColorToggle" type="checkbox" />
          <span>Color turns</span>
        </label>
        <label class="toggle-control ghost-control">
          <input id="ghostToggle" type="checkbox" />
          <span>Ghost overlay</span>
        </label>
      </div>
    </section>

    <section class="board-section">
      <div id="boardStatus" class="board-status">Ready</div>
      <canvas id="boardCanvas" class="board-canvas" aria-label="Galton board simulation"></canvas>
      <div id="labels" class="labels" aria-hidden="true"></div>
    </section>

    <!-- stats removed: UI simplified to canvas-only histogram -->


  </div>

  <script src="/static/app.js"></script>
</body>
</html>
